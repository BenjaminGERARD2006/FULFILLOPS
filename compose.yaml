
services:
  db:
    image: postgres:16
    container_name: fulfillops-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillops}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "${DB_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillops} -d ${POSTGRES_DB:-fulfillops}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
