apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fulfillops-api
  template:
    metadata:
      labels:
        app: fulfillops-api
      annotations:
        rollout.fulfillops.io/evidence: "healthy-rolling-update-argo-manual-sync"
    spec:
      containers:
        - name: api
          image: fulfillops-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DB
              value: fulfillops
            - name: POSTGRES_USER
              value: fulfillops
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  selector:
    app: fulfillops-api
  ports:
    - port: 8000
      targetPort: 8000
