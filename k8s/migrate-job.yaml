apiVersion: batch/v1
kind: Job
metadata:
  name: fulfillops-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: fulfillops-api:latest
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_DB
              value: "fulfillops"
            - name: POSTGRES_USER
              value: "fulfillops"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db-secret
                  key: password